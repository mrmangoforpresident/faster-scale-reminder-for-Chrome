<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FASTER check-in first</title>
<style>
  :root { color-scheme: light dark; --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --accent:#2a78d6; --border:rgba(11,11,11,.1); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --card:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --accent:#3987e5; --border:rgba(255,255,255,.1); } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; max-width:520px; margin:16px; }
  h1 { font-size:22px; margin:0 0 8px; } p { color:var(--ink2); margin:8px 0; }
  a.btn { display:inline-block; margin-top:12px; background:var(--accent); color:#fff; padding:10px 16px; border-radius:8px; text-decoration:none; font-weight:600; }
  code { font-size:13px; } .url { word-break:break-all; font-size:13px; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Daily check-in first</h1>
    <p id="msg">Checking today's FASTER check-in…</p>
    <p class="url" id="url"></p>
    <a class="btn" id="go" hidden>Do my check-in</a>
  </div>
  <script src="gate.js"></script>
</body>
</html>
